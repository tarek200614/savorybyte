name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Linting & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx ruff black isort

      - name: Code Quality Checks (Ruff, Black, isort)
        run: |
          ruff check backend/
          black --check backend/
          isort --check-only backend/

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://savory_user:savory_password@localhost:5432/savorybyte_test
          SECRET_KEY: ci_secret_key_test_environment_12345
        run: |
          pytest backend/app/tests

  frontend-checks:
    name: Frontend TypeCheck & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type Check & Linting
        run: |
          cd frontend
          npm run lint
          npm run build
